# Copies the Airtable Reading Feed (the daily five) into snapshots/articles/.
name: articles
on:
  schedule:
    # The morning crawl lands around 06:00 Eastern but not at a fixed minute, and GitHub's timer is
    # best-effort (it skipped 11:30 UTC on 2026-11-23). So: hourly through the morning, twice later,
    # at a quiet minute. A run with nothing new commits nothing.
    - cron: "37 10-14 * * *"
    - cron: "37 17,22 * * *"
  workflow_dispatch:           # the hub asks for a run when today's five are missing

concurrency:
  group: data-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Skipped until the repo's variables and secrets are set (see setup).
    if: ${{ vars.AIRTABLE_BASE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: jorddam/jphub, path: .hub }
      - run: python3 .hub/jobs/run.py articles --data .
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ vars.AIRTABLE_BASE }}
          AIRTABLE_TABLE: ${{ vars.AIRTABLE_TABLE }}
      - name: Commit
        run: |
          rm -rf .hub
          git config user.name "jphub jobs"
          git config user.email "jobs@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "articles $(date -u +%FT%TZ)"
          git pull --rebase --autostash && git push
