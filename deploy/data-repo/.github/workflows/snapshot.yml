# Copies every tab of the media library sheet into snapshots/library/.
name: snapshot
on:
  schedule:
    - cron: "17 */3 * * *"   # every three hours
  workflow_dispatch:           # the hub's 更新 button

concurrency:
  group: data-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Skipped until the repo's variables and secrets are set (see setup).
    if: ${{ vars.SHEET_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: jorddam/jphub, path: .hub }
      - id: google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SA_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python .hub/jobs/run.py snapshot --data .
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SHEET_ID: ${{ vars.SHEET_ID }}
      - name: Commit
        run: |
          rm -rf .hub
          git config user.name "jphub jobs"
          git config user.email "jobs@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)"
          git pull --rebase --autostash && git push
