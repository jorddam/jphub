# Finds cover art for library items that have none (new books, manga, games, channels).
# Up to 40 a run; anything it can't match is retried later and otherwise keeps a text cover.
name: covers
on:
  schedule:
    - cron: "40 9 * * *"     # daily, after the early snapshot
  workflow_dispatch:

concurrency:
  group: data-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Skipped until the repo's variables and secrets are set (see setup).
    if: ${{ vars.SHEET_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: jorddam/jphub, path: .hub }
      - run: python3 -m pip install --quiet --break-system-packages pillow
      - run: python3 .hub/jobs/run.py covers --data .
        env:
          COVERS_LIMIT: "40"
      - name: Commit
        run: |
          rm -rf .hub
          git config user.name "jphub jobs"
          git config user.email "jobs@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "covers $(date -u +%FT%TZ)"
          git pull --rebase --autostash && git push
