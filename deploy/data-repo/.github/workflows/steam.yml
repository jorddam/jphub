# Records Steam playtime once a day, fills hours / last_played in Games (PC),
# and marks games that pass the one-hour-in-30-days rule as In progress.
name: steam
on:
  schedule:
    - cron: "52 8 * * *"     # 03:52 Eastern in winter
  workflow_dispatch:

concurrency:
  group: data-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: jorddam/jphub, path: .hub }
      - id: google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SA_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python .hub/jobs/run.py steam --data .
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          STEAM_PROFILE: ${{ vars.STEAM_PROFILE }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}   # optional; without it only the top recent games are seen
      - name: Commit
        run: |
          rm -rf .hub
          git config user.name "jphub jobs"
          git config user.email "jobs@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "steam $(date -u +%FT%TZ)"
          git pull --rebase --autostash && git push
