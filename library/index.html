<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f1215">
<title>ライブラリ · 日本語ハブ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@500;700&family=DM+Mono:wght@400;500&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/ui.css">
<link rel="stylesheet" href="shelf.css">
</head>
<body>
<main class="wrap">
  <header id="top"></header>
  <div class="chips" id="types" role="group" aria-label="メディアの種類"></div>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="タイトル・作者で探す" aria-label="検索">
    <div class="chips" id="filters" role="group" aria-label="表示"></div>
  </div>
  <div id="extra"></div>
  <div class="libgrid" id="libgrid">
    <aside class="facets" id="facets" aria-label="絞り込み" hidden></aside>
    <div class="libmain">
      <div id="room" hidden></div>
      <section class="panel" id="listPanel">
        <header><h2 id="listTitle"></h2><span class="count" id="count"></span></header>
        <div class="lib" id="list"></div>
      </section>
    </div>
  </div>
</main>
<script type="module" src="page.js"></script>
</body>
</html>
